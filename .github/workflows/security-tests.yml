name: Security tests

on:
  pull_request:
  push:
    branches:
      - main
      - security/add-security-policy

permissions:
  contents: read

jobs:
  node-security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security tests
        run: npm test
